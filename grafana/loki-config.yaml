# Single-process Loki for one machine. Data is kept for ever: no retention, and old timestamps are accepted
# because each row is stamped with its captured_at, which can be weeks old.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false
  max_query_length: 0h
  # The collector reads back everything since 2020 in one query; the default 1h split makes that tens of thousands of
  # sub-queries and the connection times out.
  split_queries_by_interval: 0
  retention_period: 0s

# Loki accepts an entry only if it is within max_chunk_age/2 of the newest entry in its stream. Rows arrive with their
# captured_at, in any order across runs (another contributor's refresh of an older PR), so the window is made wide.
ingester:
  max_chunk_age: 8760h

analytics:
  reporting_enabled: false
